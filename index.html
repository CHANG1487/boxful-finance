<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOXFUL Financial Dashboard</title>
  <!--
    內容安全政策（CSP）：只允許本站、ECharts CDN 與 Google 登入／API 的來源。
    即使有人在試算表塞入惡意內容，也無法載入其他網站的腳本或把資料送到外部。
    若日後新增外部資源，需把來源加進對應的指令，否則瀏覽器會擋下（Console 會出現 CSP 錯誤）。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net https://accounts.google.com;
    style-src 'self' 'unsafe-inline' https://accounts.google.com;
    connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://accounts.google.com;
    frame-src https://accounts.google.com;
    img-src 'self' data: https://*.googleusercontent.com;
    font-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  " />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="stylesheet" href="styles.css" />
  <!-- ECharts：固定版本 + SRI 雜湊。檔案內容若被竄改，瀏覽器會拒絕執行。升級版本時必須同步更新 integrity。 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"
          integrity="sha384-o5uz97et3bErHvpKfD4Jz4n0JfhJDWABFuF4NP+iEEDxE1VwMWJ19QGR0lqFZnr6"
          crossorigin="anonymous"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>BOXFUL Financial Dashboard</h1>
        <div class="sub">資料來源：<b>2026 BUH FA</b> · 即時讀取 Google Sheet</div>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="refresh" id="refresh">
        <span class="spin">🔄</span> 重新整理
      </button>
    </div>
  </header>

  <!-- 錯誤 / 載入狀態 -->
  <div id="state" class="hidden"></div>

  <!-- 主儀表板 -->
  <main id="dash" class="wrap hidden">
    <p class="updated" id="updated">載入中…</p>

    <section class="kpis" id="kpis"></section>

    <section class="card summary hidden" id="summary"></section>

    <section class="card exceptions hidden" id="exceptions"></section>

    <div class="divider">概況</div>
    <section class="card">
      <div class="chart" id="chart-pnl"></div>
      <details class="check">
        <summary>資料檢核（確認每個指標抓對了哪一列）</summary>
        <div class="body" id="check-body"></div>
      </details>
    </section>

    <section class="card hidden" id="card-revcost">
      <div class="chart" id="chart-revcost"></div>
    </section>

    <section class="card hidden" id="card-gpexp">
      <div class="chart" id="chart-gpexp"></div>
    </section>

    <div class="divider">結構與效率分析</div>
    <section class="card hidden" id="card-rates"><div class="chart" id="chart-rates"></div></section>
    <section class="card hidden" id="card-perorder"><div class="chart" id="chart-perorder"></div></section>
    <section class="card hidden" id="card-waaship"><div class="chart" id="chart-waaship"></div></section>
    <section class="card hidden" id="card-expratio"><div class="chart" id="chart-expratio"></div></section>
    <section class="card hidden" id="card-costmix"><div class="chart" id="chart-costmix"></div></section>
    <section class="card hidden" id="card-contrib"><div class="chart" id="chart-contrib"></div></section>
  </main>

  <script src="config.js"></script>
  <script src="sheets.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
